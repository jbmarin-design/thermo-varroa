; =============================================================================
; thermo-varroa — firmware du nœud ruche (Phase 1)
;
;   pio run  -e esp32          compile le nœud ruche (ESP32-WROOM-32E, Arduino)
;   pio run  -e esp32 -t upload
;   pio device monitor -e esp32
;   pio test -e native         tests unitaires sur PC (Unity) : machine à états, sécurité,
;                              régulation, capteurs, journal, IHM, enable dynamique
;
; La logique (lib/) est portable et ne dépend d'aucun en-tête Arduino ; seul
; src/noeud/ (HAL + boucle principale) est spécifique à l'ESP32.
; Les cibles `controleur_lot` (Phase 5) seront ajoutées plus tard.
; =============================================================================

[platformio]
default_envs = esp32
src_dir = src

[env]
build_flags =
    -I include
    -Wall
    -Wextra
lib_ldf_mode = deep+

; -----------------------------------------------------------------------------
; Nœud ruche — ESP32-WROOM-32E (carte de développement type DevKitC-32E)
; -----------------------------------------------------------------------------
[env:esp32]
platform = espressif32 @ ^6.9.0          ; Arduino-ESP32 2.0.x [H] (3.x géré par #if dans le code)
board = esp32dev
framework = arduino
build_src_filter = +<noeud/>
monitor_speed = 115200
monitor_filters = time
upload_speed = 921600
lib_deps =
    paulstoffregen/OneWire @ ^2.3.8
build_flags =
    ${env.build_flags}
    -DTV_CIBLE_NOEUD=1
    -DCORE_DEBUG_LEVEL=1

; -----------------------------------------------------------------------------
; Tests unitaires sur PC (gcc/clang requis sur la machine)
; -----------------------------------------------------------------------------
[env:native]
platform = native
test_framework = unity
build_src_filter = -<*>
build_flags =
    ${env.build_flags}
    -std=gnu++17
    -DTV_NATIVE=1
lib_ignore =
    OneWire
